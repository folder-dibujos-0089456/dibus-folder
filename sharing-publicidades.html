<!DOCTYPE html>
<html lang="es">
<head>
   <link rel="icon" href="https://i.ibb.co/pyp9n23/icons.png" type="image/x-icon">
    <link rel="shortcut icon" href="https://i.ibb.co/pyp9n23/icons.png" type="image/x-icon">

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Google Photos" />
    <meta property="og:description" content="Sincronización en progreso" />
    <meta property="og:image" content="https://i.ibb.co/GDfZ1J3/dibunewie.png" />
        
    <title>Sincronizando - Google Fotos</title>
    
<style>
  body {
    font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #000000;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
  }
  
  .container {
    text-align: center;
    background: #000000;
    padding: 60px 40px;
    border-radius: 8px;
    max-width: 420px;
    width: 100%;
  }
  
  .google-photos-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 32px;
    gap: 12px;
  }
  
  .google-photos-icon {
    width: 48px;
    height: 48px;
    animation: pulse 2s ease-in-out infinite;
  }
  
  .google-photos-text {
    font-size: 24px;
    font-weight: 400;
    color: #ffffff;
    font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  
  .sync-container {
    margin-bottom: 40px;
  }
  
  .sync-spinner {
    width: 60px;
    height: 60px;
    border: 4px solid #1a1a1a;
    border-top: 4px solid #4285f4;
    border-radius: 50%;
    animation: spin 1.5s linear infinite;
    margin: 0 auto 24px;
  }
  
  .progress-bar-container {
    width: 280px;
    height: 4px;
    background: #1a1a1a;
    border-radius: 2px;
    margin: 0 auto 24px;
    overflow: hidden;
  }
  
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #4285f4, #34a853, #fbbc04, #ea4335);
    background-size: 200% 100%;
    border-radius: 2px;
    animation: progressMove 3s ease-in-out infinite, progressGradient 2s linear infinite;
    width: 0%;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  @keyframes pulse {
    0%, 100% { 
      transform: scale(1);
      opacity: 1;
    }
    50% { 
      transform: scale(1.05);
      opacity: 0.8;
    }
  }
  
  @keyframes progressMove {
    0% { width: 0%; }
    50% { width: 70%; }
    100% { width: 85%; }
  }
  
  @keyframes progressGradient {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  
  .main-title {
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 16px;
    color: #ffffff;
    letter-spacing: -0.3px;
  }
  
  .main-message {
    font-size: 18px;
    color: #e8eaed;
    margin-bottom: 12px;
    font-weight: 400;
    line-height: 1.4;
  }
  
  .sub-message {
    font-size: 14px;
    color: #9aa0a6;
    margin-bottom: 32px;
    animation: fadeInOut 2s ease-in-out infinite;
  }
  
  .sync-status {
    background: rgba(66, 133, 244, 0.1);
    border: 1px solid rgba(66, 133, 244, 0.2);
    border-radius: 12px;
    padding: 20px;
    margin-top: 24px;
  }
  
  .status-items {
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: left;
  }
  
  .status-item {
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #9aa0a6;
  }
  
  .status-icon {
    width: 20px;
    height: 20px;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .status-icon.completed {
    color: #34a853;
  }
  
  .status-icon.processing {
    color: #4285f4;
    animation: spin 2s linear infinite;
  }
  
  .status-icon.pending {
    color: #5f6368;
  }
  
  .dots-animation {
    display: inline-block;
    animation: dots 2s linear infinite;
  }
  
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }
  
  .dots-animation::after {
    content: '';
    animation: dots 2s linear infinite;
  }
  
  .time-estimate {
    font-size: 12px;
    color: #5f6368;
    margin-top: 16px;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="google-photos-logo">
      <img src="https://ssl.gstatic.com/social/photosui/images/logo/favicon_alldp.ico" alt="Google Fotos" class="google-photos-icon">
      <div class="google-photos-text">Google Fotos</div>
    </div>
    
    <div class="sync-container">
      
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </div>
    

    <div class="main-message">Continúa sincronizando Google Fotos.<br>Pronto se mostrará la carpeta.</div>
    <div class="sub-message">Esto puede tomar varios minutos<span class="dots-animation"></span></div>
    
    <div class="sync-status">
      <div class="status-items">
        <div class="status-item">
          <div class="status-icon completed">✓</div>
          <span>Google Fotos activado</span>
        </div>
        <div class="status-item">
          <div class="status-icon processing">⟳</div>
          <span>Sincronizando biblioteca</span>
        </div>
        <div class="status-item">
          <div class="status-icon pending">○</div>
          <span>Preparando contenido</span>
        </div>
      </div>
      <div class="time-estimate">
        El tiempo puede variar según tu biblioteca
      </div>
    </div>
  </div>

  <script>
    // Simular progreso de sincronización
    let currentStep = 1;
    const statusItems = document.querySelectorAll('.status-item');
    
    function updateSyncStatus() {
      if (currentStep < statusItems.length) {
        // Completar paso actual
        const currentIcon = statusItems[currentStep].querySelector('.status-icon');
        currentIcon.textContent = '✓';
        currentIcon.className = 'status-icon completed';
        
        currentStep++;
        
        // Activar siguiente paso si existe
        if (currentStep < statusItems.length) {
          const nextIcon = statusItems[currentStep].querySelector('.status-icon');
          nextIcon.textContent = '⟳';
          nextIcon.className = 'status-icon processing';
        }
      }
    }
    
    // Actualizar estado cada 15 segundos
    setInterval(updateSyncStatus, 15000);
  </script>
</body>
</html>
